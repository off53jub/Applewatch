name: LifeLog
options:
  bundleIdPrefix: com.off53jub
  deploymentTarget:
    iOS: "26.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # 話者の聞き分け（端末内）。2026-10-07 の版に固定する
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  # 日本語の音声認識 Haas-ja の Core ML 版。CI が Hugging Face から取ってきて Vendor/HaasCore に置く
  HaasCoreML:
    path: Vendor/HaasCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # CI から渡す（.github/workflows/testflight.yml）
    DEVELOPMENT_TEAM: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: ""
targets:
  LifeLog:
    type: application
    platform: iOS
    sources: [LifeLog, Shared/Audio, Shared/Intents, Shared/Widget]
    dependencies:
      - package: GoogleSignIn
      - package: FluidAudio
      - package: HaasCoreML
        product: HaasCore
      - target: LifeLogWatch
      # コントロールセンター・ロック画面のボタン
      - target: LifeLogWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.lifelog
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # アプリのアイコン（TestFlight に上げるのに要る。2026-11-07）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # 署名したときだけ効く許可（署名なしの IPA には入らない）
    # ヘルスケアを読む・家の PC からの見えない通知・ウィジェットと中身を分け合う（App Group）・即時の知らせ（2026-11-07）
    entitlements:
      path: LifeLog/LifeLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: development
        com.apple.security.application-groups: [group.com.off53jub.lifelog]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: LifeLog/Info.plist
      properties:
        CFBundleDisplayName: LifeLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 家の PC が見えない通知を送るのに使うチームの ID（例 ABCDE12345.。2026-11-07）
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        # 暗号は HTTPS などの標準のものだけ（TestFlight で毎回聞かれないように。2026-11-07）
        ITSAppUsesNonExemptEncryption: false
        # 画面の向き（TestFlight に上げるのに要る。iPhone は縦だけ、iPad は全部。2026-11-07）
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio, fetch, processing]
        # アクションボタンなどで、アプリを開かずに録音を始めたときの表示
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.off53jub.lifelog.process
          - com.off53jub.lifelog.refresh
        NSMicrophoneUsageDescription: 会話を録音して文字起こしするためにマイクを使います。
        NSSpeechRecognitionUsageDescription: 録音した音声を端末内で文字起こしします。
        NSLocationWhenInUseUsageDescription: どこで話したかを、文字起こしの見出しに添えるために使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を閉じて録音しているあいだも、どこで話したかを見出しに添えるために使います。大きく移動したときだけ記録します。
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 会話の時間の予定を、見出しと聞き取りのヒントに使います。
        NSMotionUsageDescription: 歩いている・乗り物に乗っている・寝ている、を見分けて、会話の見出しと文字起こしに使います。
        NSContactsUsageDescription: 会話で呼ばれた名前（「さいとうさん」など）を連絡先の名前の書き方に合わせて、文字起こしを正しくするために使います。
        NSHealthShareUsageDescription: 睡眠の記録で寝ているあいだを見分け、会話のあいだの心拍と、1日の睡眠・歩数を記録のまとめに添えるために読みます。
        NSHealthUpdateUsageDescription: ヘルスケアには書き込みません。
        NSLocalNetworkUsageDescription: 家の PC（LifeLog PC）に録音を送って文字にしてもらうために使います。
        NSFaceIDUsageDescription: 記録（仕事の会話を含む）を人に見られないよう、アプリを開くときに確かめます。
        NSRemindersFullAccessUsageDescription: 選んだ頼まれごとを、リマインダーに入れて期限の時刻に知らせるために使います。
        NSCameraUsageDescription: メモやホワイトボードを撮って、頼まれごと帳に書き足すために使います（読み取りは iPhone の中でします）。
        # 家の PC へは http で送る（宛先は家の中の住所か Tailscale の住所。Tailscale は通り道が暗号化されている）
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
  LifeLogWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [LifeLogWatch, Shared/Audio, Shared/Widget]
    dependencies:
      # 文字盤のボタン（コンプリケーション）
      - target: LifeLogWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.lifelog.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # 文字盤のボタンと中身を分け合う（App Group。2026-11-07）
    entitlements:
      path: LifeLogWatch/LifeLogWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.off53jub.lifelog]
    info:
      path: LifeLogWatch/Info.plist
      properties:
        CFBundleDisplayName: LifeLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.off53jub.lifelog
        # 裏での録音（WKBackgroundModes の audio は App Store では受け付けられないので、UIBackgroundModes で書く。2026-11-07）
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 会話を録音して iPhone に送るためにマイクを使います。
  # コントロールセンター・ロック画面・アクションボタンに置く LifeLog のボタン
  LifeLogWidgets:
    type: app-extension
    platform: iOS
    sources: [LifeLogWidgets, Shared/Intents, Shared/Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.lifelog.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    # アプリと中身を分け合う（App Group。2026-11-07）
    entitlements:
      path: LifeLogWidgets/LifeLogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.off53jub.lifelog]
    info:
      path: LifeLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: LifeLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # 時計の文字盤に置く LifeLog のボタン
  LifeLogWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [LifeLogWatchWidgets, Shared/Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.off53jub.lifelog.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
    # 時計のアプリと中身を分け合う（App Group。2026-11-07）
    entitlements:
      path: LifeLogWatchWidgets/LifeLogWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.off53jub.lifelog]
    info:
      path: LifeLogWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: LifeLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
