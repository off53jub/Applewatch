name: PC

# 家の PC（Windows）で Haas-ja・ReazonSpeech・Whisper を動かして多数決する LifeLog PC を作る。
# 成果物（Artifacts）の LifeLogPC を展開して LifeLogPC.exe を起動する。
on:
  push:
    branches: [main]
    paths: ['pc/**', '.github/workflows/pc.yml', '.github/scripts/swift_precheck.py']
  pull_request:
    paths: ['pc/**', '.github/workflows/pc.yml', '.github/scripts/swift_precheck.py']
  workflow_dispatch:
    inputs:
      # s25 の 堅5（2026-11-24）: main の出荷が落ちたときの「やり直し 1 回」は、この 2 つを付けて自分を呼ぶ。
      # 手で動かすときも release を入れれば、main の版をリリースにする（初めは false＝今までどおり作るだけ）
      release:
        description: 'main のときに、家の PC が入れ替える版としてリリースにする'
        type: boolean
        default: false
      retry_of:
        description: 'やり直しのもとの実行の番号（自動のやり直しが入れる。手では空のまま）'
        type: string
        default: ''

# s26 の C（2026-11-25）: 同じ PR に続けて push したら、古い実行は止める（main への push・手で動かしたもの・やり直しは、実行ごとに別の組なので止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 試しに文字にする日本語の音声（Mac の読み上げで作った作り物。pc/testdata/sample.m4a）を成果物にする。
  # s25 の 堅5（2026-11-24）: 前は Mac の機械で毎回作っていて、11/23 は Mac の順番待ちのまま始まらず、出荷（windows）まで止まった。
  #   音声はいつも同じ文なので、前の実行で作ったもの（32 KB）を pc/testdata に置き、ここは ubuntu で確かめて渡すだけにした。
  #   windows はこのジョブを待たない（checkout の pc/testdata を使う）。必須のチェックの名前「sample」はそのまま
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 試す音声を確かめる
        run: |
          cp pc/testdata/sample.m4a sample.m4a
          ls -la sample.m4a
          # 中身が入れ替わっていないか（作り直したときは、この値も直す）
          echo "01471e8fecc3c902ba39d5efad9149163ce372cebc26e2e6013af66cfc8c6fb6  sample.m4a" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: sample.m4a

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # s25 の 堅2: 作ったリリースの名前（release-result が 1 行にする）
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release: ${{ steps.release.outcome }}
    # main に入ったときに、自分で入れ替える版のリリースを作るため
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 試す音声（s25 の 堅5。前は Mac のジョブの成果物を待っていた）
      - name: 試す音声を置く
        run: cp pc/testdata/sample.m4a sample.m4a && ls -la sample.m4a

      - name: 部品を入れる
        run: python -m pip install -r pc/requirements.txt pyinstaller==6.22.3

      - name: モデルの版を確かめる
        continue-on-error: true
        run: |
          python - <<'PY'
          import traceback
          try:
              from huggingface_hub import HfApi
              for repo in ["oboroge0/Haas-ja-v1.0-onnx", "reazon-research/reazonspeech-k2-v2",
                           "mobiuslabsgmbh/faster-whisper-large-v3-turbo", "Systran/faster-whisper-large-v3",
                           "kotoba-tech/kotoba-whisper-v2.0-faster", "Qwen/Qwen3-ASR-0.6B"]:
                  info = HfApi().model_info(repo, files_metadata=True)
                  print(f"::notice::{repo} の版 {info.sha}")
                  print("::notice::" + ", ".join(f"{s.rfilename} {(s.size or 0) // 1_000_000}MB" for s in (info.siblings or [])))
          except Exception:
              print("::error::" + traceback.format_exc().replace("\n", " | ")[-3000:])
              raise
          PY

      # 言葉ごとの時刻のまとめ方と、/train-sample の保存（一時フォルダ、作った音）もここで確かめる
      # 版 5: 言いよどみ・数字をそろえた比べ方、合言葉違いの大きな音声に 401 が届くか、/llm（作り物の Ollama）も
      # 版 6: 後で受け取る文字起こし（/jobs、作り物のモデル）・見守りの画面（/dash）・自分で入れ替える仕組み
      #       （作り物の GitHub から取ってきて確かめ、入れ替えの .cmd を作り物のフォルダで本当に動かす）・意味で探す（作り物の Ollama）
      - name: 多数決の決まり・聞き逃した声の探し方・言葉の時刻・材料の保存・/llm・版 6 の機能を確かめる
        run: python pc/lifelog_pc.py --check-vote

      # 版 7（records）: POST /records/<日>・記録の画面（読む・探す・直す）・GET /edits と POST /edits/ack・
      #       音声の保存（DELETE /jobs で移す・30 日と大きさの上限・Range で返す）を、一時のフォルダと作り物で確かめる
      - name: 版 7 の記録・直し・音声の保存を確かめる
        run: |
          python pc/lifelog_pc.py --check-v7-records > records.txt 2>&1 || { cat records.txt; grep '^NG' records.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' records.txt | sed 's/^/::notice::--check-v7-records の OK の数: /'
      # 版 7（ops）: 実機の様子（POST /diag・summary.md）・見えない通知（作り物の APNs に HTTP/2 で。JWT・回数の上限・410）・
      #   TestFlight の報告（作り物の App Store Connect）・GPU の時間割・Ollama を下ろす・自動の学び直し（作り物の .cmd）・
      #   学び直しの部品の用意（ハッシュ・tar・pip の --require-hashes）を、一時フォルダで確かめる（ネットも GPU も使わない）
      - name: 版 7 の見守り（実機の様子・通知・TestFlight の報告・学び直しと GPU の時間割）を確かめる
        run: python pc/lifelog_pc.py --check-v7-ops

      # 版 8: 時間（timing）・待ち合わせ（wait=1。空白・でき上がりの答え・短くした上限で pending・切れたとき・閉じるとき）・
      #   渡した仕事に通知を送らない・下書き（haas・reazon を先に。2回読まない）・新しい区切りから・画面の時間の行を、
      #   一時フォルダと作り物のモデルで確かめる。どの確かめも、本物の HOME（log.txt・データ）には書かない
      - name: 版 8 の待ち合わせ・下書き・時間を確かめる
        run: |
          python pc/lifelog_pc.py --check-v8 > v8.txt 2>&1 || { cat v8.txt; grep '^NG' v8.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v8.txt | sed 's/^/::notice::--check-v8 の OK の数: /'

      # 2026-11-07: GPU に余裕を作る直し（合計 10GB 未満の GPU では Whisper を int8_float16 で載せる・GPU の文字起こしのモデルが
      #   あるあいだ Ollama に num_gpu 0・空きが少ないときは載せない・夜の割り当てでは付けない）を、一時フォルダと作り物の
      #   faster-whisper・作り物の GPU のメモリー・作り物の Ollama で確かめる（--check-v8 にも入っている。GPU も Ollama も使わない）
      - name: GPU に余裕を作る直しを確かめる
        run: |
          python pc/lifelog_pc.py --check-gpu > gpu.txt 2>&1 || { cat gpu.txt; grep '^NG' gpu.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' gpu.txt | sed 's/^/::notice::--check-gpu の OK の数: /'

      # 版 9: 職場の会話の印（work）・聞いて直す（並び・直す・合っている・PC の音声から材料・iPhone の材料と2重にしない）・
      #   記録を読む MCP サーバー（作り物の記録で、どの道具からも職場の会話と分からない会話が出ない・HOME に書かない・
      #   標準出力は MCP の答えだけ）を、一時フォルダと作り物の Ollama で確かめる
      - name: 版 9 の職場の印・聞いて直す・記録を読む MCP サーバーを確かめる
        run: |
          python pc/lifelog_pc.py --check-v9 > v9.txt 2>&1 || { cat v9.txt; grep '^NG' v9.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v9.txt | sed 's/^/::notice::--check-v9 の OK の数: /'

      # 版 10: 時計の外の道（127.0.0.1 だけで待つ別の受け口・時計の合言葉・/w/ping・ほかは 404・名前の形・8MB まで・
      #   待ち合わせをしない・origin watch・GET /jobs?origin=watch・iPhone から同じ名前が来ても2つにしない・10 回違えば 429・
      #   GET /watch-route・Funnel の様子の読み方（作り物の JSON）・できたの通知）を、一時フォルダと作り物のモデルで確かめる
      - name: 版 10 の時計の外の道を確かめる
        run: |
          python pc/lifelog_pc.py --check-v10 > v10.txt 2>&1 || { cat v10.txt; grep '^NG' v10.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v10.txt | sed 's/^/::notice::--check-v10 の OK の数: /'

      # 2026-11-13: Claude（鍵を出さない・帳簿と値段・上限・POST /claude と GET /claude/usage・母艦の提案などの写し・
      #   割れた行の審判・自動の材料）を、一時フォルダと作り物の Claude で確かめる（本物の鍵もネットも使わない。
      #   本物の anthropic の部品は、この PC の中の作り物の API に向けて送る形だけを見る）
      - name: Claude の取り次ぎを確かめる
        run: |
          python pc/lifelog_pc.py --check-v11 > v11.txt 2>&1 || { cat v11.txt; grep '^NG' v11.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v11.txt | sed 's/^/::notice::--check-v11 の OK の数: /'

      # 2026-11-13（施策 13・15）: 会話のあとの約束（接地・重ねない・設定・promise の通知と上限・品質の記録）と
      #   記録に質問するを母艦まで（探し方・Search-Lifelog.py の出力・お金・長さの上限・受け口）を、作り物の Claude・検索で確かめる
      - name: 会話のあとの約束と母艦への質問を確かめる
        run: |
          python pc/v12checks_promises.py > v12p.txt 2>&1 || { cat v12p.txt; grep '^NG' v12p.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v12p.txt | sed 's/^/::notice::v12checks_promises の OK の数: /'
      # 2026-11-13（施策 9・10・11・14）: 品質の記録・審判と PLAUD の合い方・同じ人かも・夜の読み直し・まとめて OK の印を、
      #   一時フォルダと作り物の Claude・作り物の声で確かめる（本物の鍵もネットも使わない）
      - name: 精度の記録・同じ人かも・夜の読み直しを確かめる
        run: |
          python pc/v12checks.py > v12.txt 2>&1 || { cat v12.txt; grep '^NG' v12.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v12.txt | sed 's/^/::notice::v12checks の OK の数: /'

      # 2026-11-14（強化案 25・28・30・32・34）: 1日の年表（GET /timeline）・PayPay の写真（画像を Claude に・残さない・422）・
      #   確かめた行と滞在を母艦の inbox へ・反映の見張り（GET /reflection）・提案の profile を、一時フォルダと作り物の Claude で確かめる
      - name: 1日の流れ・PayPay の写真・位置・反映の見張りを確かめる
        run: |
          python pc/v13checks_oneline.py > v13.txt 2>&1 || { cat v13.txt; grep '^NG' v13.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v13.txt | sed 's/^/::notice::v13checks_oneline の OK の数: /'
      # 2026-11-15（強化案 36・37・41・49）: Claude の用途ごとの止め・1日の上限（409）・GET /costs（今月・見込み・今日の用途）・
      #   GET /rollout・/checks（形を確かめる）・POST /feedback の check・提案の wish を、一時フォルダと作り物の Claude で確かめる
      - name: 施策の検品表・Claude の費用・正しさの抜き取りを確かめる
        run: |
          python pc/v14checks_settle.py > v14.txt 2>&1 || { cat v14.txt; grep '^NG' v14.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v14.txt | sed 's/^/::notice::v14checks_settle の OK の数: /'
      # 2026-11-15（強化案 58・60・62）: GET /replies・/time-ledger（形を確かめる・記録に文を書かない）と、別の機械で動かす
      #   控えの見張り（relay/）を、一時フォルダと作り物の家の PC で確かめる
      - name: 返事の下書き・時間の家計簿・控えの見張りを確かめる
        run: |
          python pc/v15checks_actions.py > v15a.txt 2>&1 || { cat v15a.txt; grep '^NG' v15a.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v15a.txt | sed 's/^/::notice::v15checks_actions の OK の数: /'

      # 2026-11-15（強化案 42・45・48）: 母艦の文の意味の索引（置く対象・まとめ方・変わったものだけ・重い時間・アプリの記録と
      #   混ざらない・読むだけ）・母艦への質問で意味と言葉をいっしょに使う（同じものは 1 つ・長さの上限・人・欲しい物・決めごとの節）・
      #   組み立ての前の Swift の検査を、一時フォルダと作り物の埋め込み・Claude で確かめる（本物の母艦も Ollama も使わない）
      - name: 母艦の意味の索引と、組み立ての前の Swift の検査を確かめる
        run: |
          python pc/v14checks_search.py > v14.txt 2>&1 || { cat v14.txt; grep '^NG' v14.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v14.txt | sed 's/^/::notice::v14checks_search の OK の数: /'

      # 2026-11-15（強化案 50・51・52）: 会議の相棒（会議モードのあいだの区切りの文・接地・1 分に 1 回・職場と Claude の設定・
      #   遅れ・GET /meeting-live?since=）・GET /coach・/tension（形を確かめる）・POST /health/hr（分ごとに母艦へ）を、
      #   一時フォルダと作り物の Claude・作り物のモデルで確かめる
      - name: 会議の相棒・話し方コーチ・緊張した場面を確かめる
        run: |
          python pc/v15checks_live.py > v15l.txt 2>&1 || { cat v15l.txt; grep '^NG' v15l.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v15l.txt | sed 's/^/::notice::v15checks_live の OK の数: /'
      # 2026-11-15（強化案 53・54・55・61）: GET /people-pages・/threads・/place-pages・/decisions（形を確かめておかしな行を落とす）・
      #   POST /decisions/answer（写しで確かめて母艦の inbox に 1 行・409・400）を、一時フォルダで確かめる
      - name: 人・話題の糸・場所・決めごとのページを確かめる
        run: |
          python pc/v15checks_pages.py > v15p.txt 2>&1 || { cat v15p.txt; grep '^NG' v15p.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v15p.txt | sed 's/^/::notice::v15checks_pages の OK の数: /'
      # 2026-11-15（強化案 56・57）: 声の特徴の置き場所（まだ無い区間だけ・時間切れ・モデル違い）・日の平均を引いた名寄せ
      #   （日をまたぐ組・名前のある人かも・自分は候補にしない）・GET /same-person の across と maybe・GET /canonical?day= を、
      #   一時フォルダと作り物の声の特徴で確かめる（本物の音声・モデル・母艦は使わない）
      - name: 声の名寄せと1日の正本を確かめる
        run: |
          python pc/v15checks_voices.py > v15.txt 2>&1 || { cat v15.txt; grep '^NG' v15.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v15.txt | sed 's/^/::notice::v15checks_voices の OK の数: /'
      # 2026-11-15: 意味で探すのモデル（bge-m3）だけは空きがあれば GPU に置く（行ったり来たりしない・MCP も合わせる・
      #   言語モデルは CPU のまま）と、Ollama の優先度を「通常以下」にするのを、作り物の空きと作り物のプロセスで確かめる
      - name: bge-m3 の置き場所と Ollama の優先度を確かめる
        run: |
          python pc/v16checks_ollama.py > v16o.txt 2>&1 || { cat v16o.txt; grep '^NG' v16o.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v16o.txt | sed 's/^/::notice::v16checks_ollama の OK の数: /'

      - name: 時計の音声の口・PC を使っているあいだの譲り・負荷の数え方を確かめる
        run: |
          python pc/v17checks_relay.py > v17.txt 2>&1 || { cat v17.txt; grep '^NG' v17.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v17.txt | sed 's/^/::notice::v17checks_relay の OK の数: /'

      # 2026-11-16: 話し手の見比べ（GET /speaker-check）を、一時フォルダと作り物の声の特徴で確かめる
      - name: 話し手の見比べを確かめる
        run: |
          python pc/v18checks_spkcheck.py > v18.txt 2>&1 || { cat v18.txt; grep '^NG' v18.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v18.txt | sed 's/^/::notice::v18checks_spkcheck の OK の数: /'

      # 2026-11-16（強化案 75）: bge-m3 を 30 分載せておく（keep_alive）・/llm で待つのは iPhone より短く・
      #   時間切れで Ollama を使えないにしないのを、作り物の Ollama で確かめる
      - name: この PC の言語モデルの載せ方と待ち方を確かめる
        run: |
          python pc/v19checks_llm.py > v19.txt 2>&1 || { cat v19.txt; grep '^NG' v19.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v19.txt | sed 's/^/::notice::v19checks_llm の OK の数: /'

      # 2026-11-16（強化案 85・99・100・128〜132）: 地名のヒント・地名の聞き間違い・場所と年表の意味の索引・場所で引く道具・
      #   答えから音声へ・迷った区間だけ Whisper に回す、を作り物の母艦と一時フォルダで確かめる
      - name: 地名・場所で探す・迷った所だけ Whisper を確かめる
        run: |
          python pc/v20checks_place.py > v20.txt 2>&1 || { cat v20.txt; grep '^NG' v20.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v20.txt | sed 's/^/::notice::v20checks_place の OK の数: /'

      # 2026-11-19（s18 自分を知ってもらう。docs/s18-know-me.md）: 見立て・1 日 1 問・抜き打ち・自信の段の写しを読む口と、
      #   アプリの答えを母艦の inbox に 1 行足す口を、作り物の母艦と一時フォルダで確かめる
      - name: 自分を知ってもらう口（見立て・1 日 1 問・答え）を確かめる
        run: |
          python pc/v22checks_knowapp.py > v22.txt 2>&1 || { cat v22.txt; grep '^NG' v22.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v22.txt | sed 's/^/::notice::v22checks_knowapp の OK の数: /'
      # 2026-11-19（s18 の 45・47・63・69〜73・78）: 声の調子・本音メモ・声で直す・安い AI→高い AI・声の見本の候補・
      #   自分の声の取り直し・聞き取りの後の辞書・PLAUD と食い違う行を、一時フォルダと作り物の Claude で確かめる
      - name: 自分を知ってもらう分を確かめる
        run: |
          python pc/v21checks_knowme.py > v21.txt 2>&1 || { cat v21.txt; grep '^NG' v21.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v21.txt | sed 's/^/::notice::v21checks_knowme の OK の数: /'

      # 2026-11-21（s19「休日のライフログ」休12〜15。docs/s19-holiday-pc.md）: 騒がしい場・車内のナビの声・動画や配信の音（仮）・
      #   3 人以上の会話の「彼女」「同棲」などに印を付ける口を、作り物の記録と母艦と一時フォルダで確かめる
      - name: 休日の印（騒がしい場・車内・メディアの音・確かめ待ち）を確かめる
        run: |
          python pc/v23checks_holiday.py > v23.txt 2>&1 || { cat v23.txt; grep '^NG' v23.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v23.txt | sed 's/^/::notice::v23checks_holiday の OK の数: /'

      # 2026-11-21（s20 次5・次6・次11・次13・追10）: 声が集まりすぎた話し手の候補・自分の行の近さの印・時間を選んで消す口（控え 7 日・取り消し）・
      #   「一緒にいた人」の問い（yesno・根拠）・LINE の webhook（署名・本人だけ・母艦の inbox へ）を、作り物の記録・声・母艦・LINE と一時フォルダで確かめる
      - name: s20（集まりすぎの話し手・自分の行・時間を選んで消す・LINE の受け口）を確かめる
        run: |
          python pc/v24checks_s20.py > v24.txt 2>&1 || { cat v24.txt; grep '^NG' v24.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v24.txt | sed 's/^/::notice::v24checks_s20 の OK の数: /'

      - name: 学び直しの台本が GPU・材料が無いときに断るか確かめる
        run: |
          python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" pc/train_personal.py
          set +e
          python pc/train_personal.py --home "$RUNNER_TEMP/empty-home" > train.txt 2>&1
          code=$?
          set -e
          cat train.txt
          if [ "$code" != 2 ]; then echo "::error::train_personal.py の終わりの番号が $code（2 のはず）"; exit 1; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/LifeLogPC/model
            ~/AppData/Local/LifeLogPC/reazon
            ~/AppData/Local/LifeLogPC/whisper
            ~/AppData/Local/LifeLogPC/speaker
            ~/AppData/Local/LifeLogPC/tagging
            ~/AppData/Local/LifeLogPC/enhance
            ~/AppData/Local/LifeLogPC/vad
          key: lifelog-pc-models-${{ hashFiles('pc/lifelog_pc.py') }}
          restore-keys: lifelog-pc-models-

      - name: モデルを取ってくる
        run: |
          python pc/lifelog_pc.py --download > dl.txt 2>&1 || { tail -c 3000 dl.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          tail -3 dl.txt

      - name: Python のまま試す
        run: |
          python pc/lifelog_pc.py --test sample.m4a --hints "今日、会議、東京" --enhance > test.txt 2>&1 || { tail -c 3000 test.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat test.txt
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -v '^20' test.txt)

      # 話し手の声の特徴（/speakers、CAM++）・周りの音（/scene）・雑音を除くモデル（enhance=1）・Silero VAD（vad=union）を
      # 取ってきて、実際に動くか確かめる
      - name: おまけの機能を Python のまま試す
        run: |
          python pc/lifelog_pc.py --check-extras sample.m4a > extras.txt 2>&1 || { cat extras.txt; tail -c 3000 extras.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat extras.txt
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -E '^(OK|NG|話し手|周りの音|雑音|Silero|この PC)' extras.txt)

      # s25 の 大6: 毎晩の通し試験（nightly.yml）と同じ段を、この版でも 1 回通して、まとめに表を出す（報告だけ・落とさない）
      - name: 見本の 1 日を通す（報告だけ）
        continue-on-error: true
        run: python pc/s25c_nightly.py --asr test.txt --extras extras.txt --summary "$GITHUB_STEP_SUMMARY"

      # 版 6 の部品（jobqueue・dashboard・updater・semantic・v6checks）は pc/ にあるので、--paths pc で探させ、念のため名前でも入れる。
      # 版 7（records）の部品（records・recordsui・v7checks_records）も同じ。
      # 版 7（ops）の部品（ops・diag・apns・ascfeedback・trainer・gpu・v7checks_ops）と、見えない通知の HTTP/2（httpx2 と h2）・
      # 鍵（cryptography）も名前で入れる。版 8 の確かめ（v8checks）・版 9 の確かめ（v9checks）と MCP サーバー（lifelog_mcp）・版 10 の時計の外の道（watchroute・v10checks）も同じ。train-requirements.txt は学び直しの部品の一覧（exe の隣に置く）
      # 2026-11-13: Claude（claude・v11checks）と anthropic の部品（中の httpx2・httpcore2 と、つなぐときに読む opentelemetry と
      #   その入口の一覧）も入れる。
      # BUILD.txt は作った回の番号（exe が自分の版を知り、新しい版と比べるのに使う）
      - name: exe にする
        run: |
          pyinstaller --noconfirm --onedir --console --name LifeLogPC --paths pc \
            --collect-all sherpa_onnx --collect-all av --collect-all faster_whisper \
            --collect-all ctranslate2 --collect-all pykakasi --collect-all tokenizers \
            --hidden-import tarfile --hidden-import bz2 --hidden-import sqlite3 \
            --hidden-import jobqueue --hidden-import dashboard --hidden-import updater \
            --hidden-import semantic --hidden-import v6checks \
            --hidden-import records --hidden-import recordsui --hidden-import v7checks_records \
            --hidden-import ops --hidden-import diag --hidden-import apns --hidden-import ascfeedback \
            --hidden-import trainer --hidden-import gpu --hidden-import v7checks_ops \
            --hidden-import v8checks --hidden-import v9checks --hidden-import lifelog_mcp \
            --hidden-import watchroute --hidden-import v10checks --hidden-import mothership --hidden-import appfeeds \
            --hidden-import oneline --hidden-import askmother --hidden-import mothersearch --hidden-import priority --hidden-import presence --hidden-import load --hidden-import settle --hidden-import pages \
            --hidden-import drafts --hidden-import knowapp --hidden-import holidaymarks \
            --hidden-import splitcand --hidden-import selflines --hidden-import forget --hidden-import linehook --hidden-import v24checks_s20 \
            --hidden-import httpx2 --hidden-import httpcore2._sync.http2 --collect-submodules h2 \
            --hidden-import hpack --hidden-import hyperframe \
            --hidden-import claude --hidden-import v11checks \
            --hidden-import quality --hidden-import judgecheck --hidden-import sameperson --hidden-import nightreview \
            --collect-all anthropic --collect-submodules httpx2 --collect-submodules httpcore2 \
            --collect-submodules opentelemetry --copy-metadata opentelemetry-api \
            --hidden-import cryptography.hazmat.primitives.asymmetric.ec \
            --hidden-import cryptography.hazmat.primitives.serialization \
            --exclude-module torch --exclude-module transformers --exclude-module qwen_asr pc/lifelog_pc.py
          cp pc/README.txt pc/train_personal.py pc/train-requirements.txt dist/LifeLogPC/
          echo "${{ github.run_number }}" > dist/LifeLogPC/BUILD.txt

      # exe に版 6 の部品が入っているか（多数決の決まりから意味で探すまで、Python のときと同じものを exe で）
      - name: exe で多数決の決まり・版 6 の機能を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-vote > vote-exe.txt 2>&1 || { cat vote-exe.txt; grep '^NG' vote-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' vote-exe.txt | sed 's/^/::notice::exe の --check-vote の OK の数: /'

      # 版 7（records）の部品が exe に入っているか（Python のときと同じものを exe で）
      - name: exe で版 7 の記録・直し・音声の保存を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v7-records > records-exe.txt 2>&1 || { cat records-exe.txt; grep '^NG' records-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' records-exe.txt | sed 's/^/::notice::exe の --check-v7-records の OK の数: /'
      # exe に版 7 の部品（HTTP/2 の h2・鍵の cryptography も）が入っているか。作り物の学び直しは .cmd なので exe でも動く
      - name: exe で版 7 の見守りを確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v7-ops > v7-exe.txt 2>&1 || { cat v7-exe.txt; grep '^NG' v7-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v7-exe.txt | sed 's/^/::notice::exe の --check-v7-ops の OK の数: /'
      # 版 8 の部品（v8checks）が exe に入っているか（Python のときと同じものを exe で）
      - name: exe で版 8 の待ち合わせ・下書き・時間を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v8 > v8-exe.txt 2>&1 || { cat v8-exe.txt; grep '^NG' v8-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v8-exe.txt | sed 's/^/::notice::exe の --check-v8 の OK の数: /'
      # 版 9 の部品（v9checks・lifelog_mcp）が exe に入っているか。MCP サーバーは LifeLogPC.exe --mcp で動かして確かめる
      - name: exe で版 9 の職場の印・聞いて直す・記録を読む MCP サーバーを確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v9 > v9-exe.txt 2>&1 || { cat v9-exe.txt; grep '^NG' v9-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v9-exe.txt | sed 's/^/::notice::exe の --check-v9 の OK の数: /'
      # 版 10 の部品（watchroute・v10checks）が exe に入っているか
      - name: exe で版 10 の時計の外の道を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v10 > v10-exe.txt 2>&1 || { cat v10-exe.txt; grep '^NG' v10-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v10-exe.txt | sed 's/^/::notice::exe の --check-v10 の OK の数: /'
      # Claude の部品（claude・v11checks・anthropic）が exe に入っているか。本物の anthropic の部品も exe の中で動かす
      - name: exe で Claude の取り次ぎを確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v11 > v11-exe.txt 2>&1 || { cat v11-exe.txt; grep '^NG' v11-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v11-exe.txt | sed 's/^/::notice::exe の --check-v11 の OK の数: /'

      - name: exe で試す
        run: |
          dist/LifeLogPC/LifeLogPC.exe --test sample.m4a --hints "今日、会議、東京" --enhance > test-exe.txt 2>&1 || { tail -c 3000 test-exe.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat test-exe.txt
          while IFS= read -r line; do echo "::notice::exe: $line"; done < <(grep -v '^20' test-exe.txt)

      # モデルはもう取ってきてあるので、exe でも速く試せる
      - name: おまけの機能を exe で試す
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-extras sample.m4a > extras-exe.txt 2>&1 || { cat extras-exe.txt; tail -c 3000 extras-exe.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat extras-exe.txt
          while IFS= read -r line; do echo "::notice::exe: $line"; done < <(grep -E '^(OK|NG|話し手|周りの音|雑音|Silero|この PC)' extras-exe.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: LifeLogPC
          path: dist/LifeLogPC

      # main に入ったときだけ、家の PC が自分で入れ替える版として GitHub のリリースにする（pc-v6-回の番号）。
      # --latest=false --prerelease なので、アプリのリリース（v2026.MM.DD-N）がいつも「Latest」のまま。
      # s25 の 堅5: main の push のほか、やり直し（workflow_dispatch の release=true）でも作る。作った名前は release-result が読む
      - name: 自分で入れ替える版としてリリースにする（main のときだけ）
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re,sys; print(re.search(r'^VERSION = (\d+)', open('pc/lifelog_pc.py', encoding='utf-8').read(), re.M).group(1))")
          TAG="pc-v${VER}-${{ github.run_number }}"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path("dist/LifeLogPC")
          with zipfile.ZipFile("LifeLogPC.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      z.write(path, (Path("LifeLogPC") / path.relative_to(root)).as_posix())
          PY
          sha256sum LifeLogPC.zip | sed 's/ \*/  /' > LifeLogPC.zip.sha256
          cat LifeLogPC.zip.sha256
          ls -la LifeLogPC.zip
          # s25 の 堅5: GitHub の一時的な失敗に備えて、やり直しは 1 回（30 秒あけて）。途中までできたリリースがあれば、ファイルを上書きで足す
          made=false
          for attempt in 1 2; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" LifeLogPC.zip LifeLogPC.zip.sha256 --clobber && made=true
            else
              gh release create "$TAG" LifeLogPC.zip LifeLogPC.zip.sha256 --title "$TAG" --target "${{ github.sha }}" \
                --latest=false --prerelease \
                --notes "家の PC の LifeLog PC（版 ${VER}、作った回 ${{ github.run_number }}）。版 6 からの LifeLog PC は、これを自分で取ってきて入れ替えます。手で入れるときは LifeLogPC.zip を展開します。" \
                && made=true
            fi
            [ "$made" = true ] && break
            echo "::warning::リリースを作れなかった（${attempt} 回目）。30 秒あけてもう一度"
            sleep 30
          done
          [ "$made" = true ] || { echo "::error::リリース $TAG を作れなかった"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::リリース $TAG を作りました"

  # s25 の 堅2・堅5（2026-11-24）: 家の PC の出荷（main のリリース）が、できたか・できなかったかを、TestFlight と同じ形の 1 行で必ず出す。
  #   ログ・注記（annotations）・実行のまとめ（$GITHUB_STEP_SUMMARY）に出す。母艦（M2）は「PC_RELEASE_RESULT:」で探す:
  #     PC_RELEASE_RESULT: released tag=pc-vN-M run=R
  #     PC_RELEASE_RESULT: not-released reason=... run=R retry=dispatched|no
  #       reason は build-failed（組み立て・確かめで落ちた）・release-failed（リリースを作る所で落ちた）・cancelled（止めた・時間切れ）・
  #       skipped（windows が始まらなかった）・no-tag（成功なのに名前が無い）
  #   できなかったときは、1 回だけ自分（pc.yml）を main で動かし直す（release=true・retry_of=この実行）。やり直しの実行が落ちたら、もうやらない。
  #   後から main に新しい push の実行があれば、そちらが出荷するので、やり直さない。初めはオン
  release-result:
    needs: windows
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: 家の PC の出荷をまとめる
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.windows.result }}
          TAG: ${{ needs.windows.outputs.tag }}
          REL: ${{ needs.windows.outputs.release }}
          RUN: ${{ github.run_id }}
          RETRY_OF: ${{ inputs.retry_of }}
        run: |
          retry=no
          if [ "$RESULT" = "success" ] && [ -n "$TAG" ]; then
            line="PC_RELEASE_RESULT: released tag=$TAG run=$RUN"
            echo "::notice::$line"
            msg="家の PC の版 $TAG をリリースにしました（家の PC は自分で取ってきて入れ替えます）"
          else
            case "$RESULT" in
              success) reason="no-tag" ;;
              cancelled) reason="cancelled" ;;
              skipped) reason="skipped" ;;
              *) if [ "$REL" = "failure" ]; then reason="release-failed"; else reason="build-failed"; fi ;;
            esac
            # やり直し 1 回（やり直しの実行ではしない・後から新しい main の実行があればしない）
            if [ -z "$RETRY_OF" ]; then
              newest=$(gh run list --repo "$REPO" --workflow pc.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
              if [ -n "$newest" ] && [ "$newest" -gt "$RUN" ] 2>/dev/null; then
                echo "後から新しい main の実行（$newest）があるので、やり直さない"
              elif gh workflow run pc.yml --repo "$REPO" --ref main -f release=true -f retry_of="$RUN"; then
                retry=dispatched
              else
                echo "::warning::やり直しを始められなかった"
              fi
            fi
            line="PC_RELEASE_RESULT: not-released reason=$reason run=$RUN retry=$retry"
            echo "::warning::$line（家の PC に新しい版は届いていません）"
            msg="家の PC の版をリリースにできませんでした（理由: $reason）"
            [ "$retry" = dispatched ] && msg="$msg。1 回だけ自動でやり直しています"
            [ -n "$RETRY_OF" ] && msg="$msg。これは実行 $RETRY_OF のやり直しでした（もうやり直しません）"
          fi
          echo "$line"
          { echo "### 家の PC の出荷"; echo; echo "$msg"; echo; echo "\`$line\`"; } >> "$GITHUB_STEP_SUMMARY"
