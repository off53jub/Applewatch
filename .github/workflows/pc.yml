name: PC

# 家の PC（Windows）で Haas-ja・ReazonSpeech・Whisper を動かして多数決する LifeLog PC を作る。
# 成果物（Artifacts）の LifeLogPC を展開して LifeLogPC.exe を起動する。
on:
  push:
    branches: [main]
    paths: ['pc/**', '.github/workflows/pc.yml']
  pull_request:
    paths: ['pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:

jobs:
  # 試しに文字にする日本語の音声を作る（Mac の読み上げ）
  sample:
    runs-on: macos-latest
    steps:
      - name: 試す音声を作る
        run: |
          say -v Kyoko -o s.aiff "今日の会議では、来月の予算と、新しいシステムの導入について話し合いました。"
          afconvert s.aiff -o sample.m4a -f m4af -d 'aac@16000' -c 1 -b 32000
          ls -la sample.m4a
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: sample.m4a

  windows:
    needs: sample
    runs-on: windows-latest
    timeout-minutes: 60
    # main に入ったときに、自分で入れ替える版のリリースを作るため
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sample

      - name: 部品を入れる
        run: python -m pip install -r pc/requirements.txt pyinstaller==6.22.3

      - name: モデルの版を確かめる
        continue-on-error: true
        run: |
          python - <<'PY'
          import traceback
          try:
              from huggingface_hub import HfApi
              for repo in ["oboroge0/Haas-ja-v1.0-onnx", "reazon-research/reazonspeech-k2-v2",
                           "mobiuslabsgmbh/faster-whisper-large-v3-turbo", "Systran/faster-whisper-large-v3",
                           "kotoba-tech/kotoba-whisper-v2.0-faster", "Qwen/Qwen3-ASR-0.6B"]:
                  info = HfApi().model_info(repo, files_metadata=True)
                  print(f"::notice::{repo} の版 {info.sha}")
                  print("::notice::" + ", ".join(f"{s.rfilename} {(s.size or 0) // 1_000_000}MB" for s in (info.siblings or [])))
          except Exception:
              print("::error::" + traceback.format_exc().replace("\n", " | ")[-3000:])
              raise
          PY

      # 言葉ごとの時刻のまとめ方と、/train-sample の保存（一時フォルダ、作った音）もここで確かめる
      # 版 5: 言いよどみ・数字をそろえた比べ方、合言葉違いの大きな音声に 401 が届くか、/llm（作り物の Ollama）も
      # 版 6: 後で受け取る文字起こし（/jobs、作り物のモデル）・見守りの画面（/dash）・自分で入れ替える仕組み
      #       （作り物の GitHub から取ってきて確かめ、入れ替えの .cmd を作り物のフォルダで本当に動かす）・意味で探す（作り物の Ollama）
      - name: 多数決の決まり・聞き逃した声の探し方・言葉の時刻・材料の保存・/llm・版 6 の機能を確かめる
        run: python pc/lifelog_pc.py --check-vote

      # 版 7（records）: POST /records/<日>・記録の画面（読む・探す・直す）・GET /edits と POST /edits/ack・
      #       音声の保存（DELETE /jobs で移す・30 日と大きさの上限・Range で返す）を、一時のフォルダと作り物で確かめる
      - name: 版 7 の記録・直し・音声の保存を確かめる
        run: |
          python pc/lifelog_pc.py --check-v7-records > records.txt 2>&1 || { cat records.txt; grep '^NG' records.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' records.txt | sed 's/^/::notice::--check-v7-records の OK の数: /'
      # 版 7（ops）: 実機の様子（POST /diag・summary.md）・見えない通知（作り物の APNs に HTTP/2 で。JWT・回数の上限・410）・
      #   TestFlight の報告（作り物の App Store Connect）・GPU の時間割・Ollama を下ろす・自動の学び直し（作り物の .cmd）・
      #   学び直しの部品の用意（ハッシュ・tar・pip の --require-hashes）を、一時フォルダで確かめる（ネットも GPU も使わない）
      - name: 版 7 の見守り（実機の様子・通知・TestFlight の報告・学び直しと GPU の時間割）を確かめる
        run: python pc/lifelog_pc.py --check-v7-ops

      # 版 8: 時間（timing）・待ち合わせ（wait=1。空白・でき上がりの答え・短くした上限で pending・切れたとき・閉じるとき）・
      #   渡した仕事に通知を送らない・下書き（haas・reazon を先に。2回読まない）・新しい区切りから・画面の時間の行を、
      #   一時フォルダと作り物のモデルで確かめる。どの確かめも、本物の HOME（log.txt・データ）には書かない
      - name: 版 8 の待ち合わせ・下書き・時間を確かめる
        run: |
          python pc/lifelog_pc.py --check-v8 > v8.txt 2>&1 || { cat v8.txt; grep '^NG' v8.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v8.txt | sed 's/^/::notice::--check-v8 の OK の数: /'

      # 版 9: 職場の会話の印（work）・聞いて直す（並び・直す・合っている・PC の音声から材料・iPhone の材料と2重にしない）・
      #   記録を読む MCP サーバー（作り物の記録で、どの道具からも職場の会話と分からない会話が出ない・HOME に書かない・
      #   標準出力は MCP の答えだけ）を、一時フォルダと作り物の Ollama で確かめる
      - name: 版 9 の職場の印・聞いて直す・記録を読む MCP サーバーを確かめる
        run: |
          python pc/lifelog_pc.py --check-v9 > v9.txt 2>&1 || { cat v9.txt; grep '^NG' v9.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v9.txt | sed 's/^/::notice::--check-v9 の OK の数: /'

      - name: 学び直しの台本が GPU・材料が無いときに断るか確かめる
        run: |
          python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" pc/train_personal.py
          set +e
          python pc/train_personal.py --home "$RUNNER_TEMP/empty-home" > train.txt 2>&1
          code=$?
          set -e
          cat train.txt
          if [ "$code" != 2 ]; then echo "::error::train_personal.py の終わりの番号が $code（2 のはず）"; exit 1; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/LifeLogPC/model
            ~/AppData/Local/LifeLogPC/reazon
            ~/AppData/Local/LifeLogPC/whisper
            ~/AppData/Local/LifeLogPC/speaker
            ~/AppData/Local/LifeLogPC/tagging
            ~/AppData/Local/LifeLogPC/enhance
            ~/AppData/Local/LifeLogPC/vad
          key: lifelog-pc-models-${{ hashFiles('pc/lifelog_pc.py') }}
          restore-keys: lifelog-pc-models-

      - name: モデルを取ってくる
        run: |
          python pc/lifelog_pc.py --download > dl.txt 2>&1 || { tail -c 3000 dl.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          tail -3 dl.txt

      - name: Python のまま試す
        run: |
          python pc/lifelog_pc.py --test sample.m4a --hints "今日、会議、東京" --enhance > test.txt 2>&1 || { tail -c 3000 test.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat test.txt
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -v '^20' test.txt)

      # 話し手の声の特徴（/speakers、CAM++）・周りの音（/scene）・雑音を除くモデル（enhance=1）・Silero VAD（vad=union）を
      # 取ってきて、実際に動くか確かめる
      - name: おまけの機能を Python のまま試す
        run: |
          python pc/lifelog_pc.py --check-extras sample.m4a > extras.txt 2>&1 || { cat extras.txt; tail -c 3000 extras.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat extras.txt
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -E '^(OK|NG|話し手|周りの音|雑音|Silero|この PC)' extras.txt)

      # 版 6 の部品（jobqueue・dashboard・updater・semantic・v6checks）は pc/ にあるので、--paths pc で探させ、念のため名前でも入れる。
      # 版 7（records）の部品（records・recordsui・v7checks_records）も同じ。
      # 版 7（ops）の部品（ops・diag・apns・ascfeedback・trainer・gpu・v7checks_ops）と、見えない通知の HTTP/2（httpx2 と h2）・
      # 鍵（cryptography）も名前で入れる。版 8 の確かめ（v8checks）・版 9 の確かめ（v9checks）と MCP サーバー（lifelog_mcp）も同じ。train-requirements.txt は学び直しの部品の一覧（exe の隣に置く）
      # BUILD.txt は作った回の番号（exe が自分の版を知り、新しい版と比べるのに使う）
      - name: exe にする
        run: |
          pyinstaller --noconfirm --onedir --console --name LifeLogPC --paths pc \
            --collect-all sherpa_onnx --collect-all av --collect-all faster_whisper \
            --collect-all ctranslate2 --collect-all pykakasi --collect-all tokenizers \
            --hidden-import tarfile --hidden-import bz2 --hidden-import sqlite3 \
            --hidden-import jobqueue --hidden-import dashboard --hidden-import updater \
            --hidden-import semantic --hidden-import v6checks \
            --hidden-import records --hidden-import recordsui --hidden-import v7checks_records \
            --hidden-import ops --hidden-import diag --hidden-import apns --hidden-import ascfeedback \
            --hidden-import trainer --hidden-import gpu --hidden-import v7checks_ops \
            --hidden-import v8checks --hidden-import v9checks --hidden-import lifelog_mcp \
            --hidden-import httpx2 --hidden-import httpcore2._sync.http2 --collect-submodules h2 \
            --hidden-import hpack --hidden-import hyperframe \
            --hidden-import cryptography.hazmat.primitives.asymmetric.ec \
            --hidden-import cryptography.hazmat.primitives.serialization \
            --exclude-module torch --exclude-module transformers --exclude-module qwen_asr pc/lifelog_pc.py
          cp pc/README.txt pc/train_personal.py pc/train-requirements.txt dist/LifeLogPC/
          echo "${{ github.run_number }}" > dist/LifeLogPC/BUILD.txt

      # exe に版 6 の部品が入っているか（多数決の決まりから意味で探すまで、Python のときと同じものを exe で）
      - name: exe で多数決の決まり・版 6 の機能を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-vote > vote-exe.txt 2>&1 || { cat vote-exe.txt; grep '^NG' vote-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' vote-exe.txt | sed 's/^/::notice::exe の --check-vote の OK の数: /'

      # 版 7（records）の部品が exe に入っているか（Python のときと同じものを exe で）
      - name: exe で版 7 の記録・直し・音声の保存を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v7-records > records-exe.txt 2>&1 || { cat records-exe.txt; grep '^NG' records-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' records-exe.txt | sed 's/^/::notice::exe の --check-v7-records の OK の数: /'
      # exe に版 7 の部品（HTTP/2 の h2・鍵の cryptography も）が入っているか。作り物の学び直しは .cmd なので exe でも動く
      - name: exe で版 7 の見守りを確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v7-ops > v7-exe.txt 2>&1 || { cat v7-exe.txt; grep '^NG' v7-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v7-exe.txt | sed 's/^/::notice::exe の --check-v7-ops の OK の数: /'
      # 版 8 の部品（v8checks）が exe に入っているか（Python のときと同じものを exe で）
      - name: exe で版 8 の待ち合わせ・下書き・時間を確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v8 > v8-exe.txt 2>&1 || { cat v8-exe.txt; grep '^NG' v8-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v8-exe.txt | sed 's/^/::notice::exe の --check-v8 の OK の数: /'
      # 版 9 の部品（v9checks・lifelog_mcp）が exe に入っているか。MCP サーバーは LifeLogPC.exe --mcp で動かして確かめる
      - name: exe で版 9 の職場の印・聞いて直す・記録を読む MCP サーバーを確かめる
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-v9 > v9-exe.txt 2>&1 || { cat v9-exe.txt; grep '^NG' v9-exe.txt | sed 's/^/::error::/'; exit 1; }
          grep -c '^OK' v9-exe.txt | sed 's/^/::notice::exe の --check-v9 の OK の数: /'

      - name: exe で試す
        run: |
          dist/LifeLogPC/LifeLogPC.exe --test sample.m4a --hints "今日、会議、東京" --enhance > test-exe.txt 2>&1 || { tail -c 3000 test-exe.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat test-exe.txt
          while IFS= read -r line; do echo "::notice::exe: $line"; done < <(grep -v '^20' test-exe.txt)

      # モデルはもう取ってきてあるので、exe でも速く試せる
      - name: おまけの機能を exe で試す
        run: |
          dist/LifeLogPC/LifeLogPC.exe --check-extras sample.m4a > extras-exe.txt 2>&1 || { cat extras-exe.txt; tail -c 3000 extras-exe.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit 1; }
          cat extras-exe.txt
          while IFS= read -r line; do echo "::notice::exe: $line"; done < <(grep -E '^(OK|NG|話し手|周りの音|雑音|Silero|この PC)' extras-exe.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: LifeLogPC
          path: dist/LifeLogPC

      # main に入ったときだけ、家の PC が自分で入れ替える版として GitHub のリリースにする（pc-v6-回の番号）。
      # --latest=false --prerelease なので、アプリのリリース（v2026.MM.DD-N）がいつも「Latest」のまま。
      - name: 自分で入れ替える版としてリリースにする（main のときだけ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re,sys; print(re.search(r'^VERSION = (\d+)', open('pc/lifelog_pc.py', encoding='utf-8').read(), re.M).group(1))")
          TAG="pc-v${VER}-${{ github.run_number }}"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path("dist/LifeLogPC")
          with zipfile.ZipFile("LifeLogPC.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      z.write(path, (Path("LifeLogPC") / path.relative_to(root)).as_posix())
          PY
          sha256sum LifeLogPC.zip | sed 's/ \*/  /' > LifeLogPC.zip.sha256
          cat LifeLogPC.zip.sha256
          ls -la LifeLogPC.zip
          gh release create "$TAG" LifeLogPC.zip LifeLogPC.zip.sha256 --title "$TAG" --target "${{ github.sha }}" \
            --latest=false --prerelease \
            --notes "家の PC の LifeLog PC（版 ${VER}、作った回 ${{ github.run_number }}）。版 6 からの LifeLog PC は、これを自分で取ってきて入れ替えます。手で入れるときは LifeLogPC.zip を展開します。"
          echo "::notice::リリース $TAG を作りました"
