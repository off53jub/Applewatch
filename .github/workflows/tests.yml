name: Tests

# 記録を壊しうる処理（同期の合わせ方・消す行の見つけ方）と名前の取り出しを、iPhone のシミュレーターで確かめる。
# IPA を作る「TestFlight」とは別に動くので、ここが失敗しても IPA は作られる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じ PR に続けて push したら、古い実行は止める（main への push は止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更されたファイルを見て、関係ない変更（pc/・docs/・文書・ほかの workflow だけ）なら重い検査を飛ばす（速10）。
  # 飛ばしたジョブは Skipped になり、必須の検査としては通る。判定に失敗したときは、必ず動かす側に倒す。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      ui: ${{ steps.f.outputs.ui }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          IGNORE='^(pc/|docs/|LifeLogUITests/)|\.md$|^\.github/workflows/(pc|testflight)\.yml$|^\.github/scripts/(screens|grid|contrast|words)\.py$'
          files=""
          ok=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)') && ok=true
          elif [ "$EVENT" = "push" ] && [ "${BEFORE#0000000}" = "$BEFORE" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[] | .filename, (.previous_filename // empty)') && ok=true
            # compare は 300 ファイルまで。それ以上は全部動かす
            [ "$(echo "$files" | wc -l)" -ge 300 ] && ok=false
          fi
          [ -n "$files" ] || ok=false
          echo "変更したファイル:"; echo "$files" | head -50
          rest=$(echo "$files" | grep -Ev "$IGNORE" || true)
          if [ "$ok" = "true" ] && [ -z "$rest" ]; then app=false; else app=true; fi
          # 画面の写真の見回りには効かない変更（時計だけ・テストだけ）なら、見回りも飛ばす
          IGNORE_UI='^(pc/|docs/|LifeLogTests/|LifeLogWatch/|LifeLogWatchWidgets/)|\.md$|^\.github/workflows/(pc|testflight)\.yml$'
          rest_ui=$(echo "$files" | grep -Ev "$IGNORE_UI" || true)
          if [ "$ok" = "true" ] && [ -z "$rest_ui" ]; then ui=false; else ui=true; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "判定 ok=$ok app=$app ui=${ui:-}"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 強化案 45: 組み立ての前に、文字列の中の生の改行と、見本の長いクロージャ（型推論の時間切れ）を数秒で見つける
      - name: Swift の組み立ての前の検査
        run: python3 .github/scripts/swift_precheck.py

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # TestFlight と同じ版の Haas-ja の Swift 部品（アプリをビルドするのに要る）
      - name: Haas-ja の Swift 部品を取ってくる
        run: |
          set -e
          rev=62f542657b454afa7873424e3dfb6d7a1d9c270d
          base=https://huggingface.co/Sanami/haas-ja-coreml/resolve/$rev
          mkdir -p Vendor/HaasCore/Sources/HaasCore LifeLog/Haas
          for f in Audio Frontend HaasASR Tokenizer; do
            curl -fsSL "$base/swift/Sources/HaasCore/$f.swift" -o "Vendor/HaasCore/Sources/HaasCore/$f.swift"
          done
          curl -fsSL "$base/swift/Resources/frontend.bin" -o LifeLog/Haas/frontend.bin
          curl -fsSL "$base/swift/Resources/vocab.json" -o LifeLog/Haas/vocab.json
          cat > Vendor/HaasCore/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HaasCoreML",
              platforms: [.macOS(.v14), .iOS(.v17)],
              products: [.library(name: "HaasCore", targets: ["HaasCore"])],
              targets: [.target(name: "HaasCore", path: "Sources/HaasCore")]
          )
          SWIFT

      # 速11: 部品の作り置き（仮説: 2 回目の実行から効く）。SwiftPM の取ってきた部品と、Xcode のコンパイルの作り置き（中身は中間ファイルだけ。署名済みの成果物・鍵は入らない）
      - name: SwiftPM の部品の作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-test-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-test-${{ runner.os }}-
      - name: コンパイルの作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: cc-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-test-${{ runner.os }}-

      - name: テスト用のプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate --spec project-tests.yml

      - name: テストする
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E "^[[:space:]]+iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "シミュレーター: $udid"
          xcodebuild test \
            -project LifeLog.xcodeproj -scheme LifeLogTests \
            -destination "id=$udid" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cc" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/test.log" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status

  # 全部の画面を開いて写真を撮る（2026-11-06）。見本の記録（作り物）を入れたシミュレーターで、タブと設定の行を1つずつ開く。
  # 開いたとたんに落ちる画面があれば失敗にする。写真は成果物「画面の写真」に残し、main ではリリースにも一覧の画像を付ける。
  screens:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui != 'false' }}
    runs-on: macos-26
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 強化案 45: 組み立ての前に、文字列の中の生の改行と、見本の長いクロージャ（型推論の時間切れ）を数秒で見つける
      - name: Swift の組み立ての前の検査
        run: python3 .github/scripts/swift_precheck.py

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # TestFlight と同じ版の Haas-ja の Swift 部品（アプリをビルドするのに要る）
      - name: Haas-ja の Swift 部品を取ってくる
        run: |
          set -e
          rev=62f542657b454afa7873424e3dfb6d7a1d9c270d
          base=https://huggingface.co/Sanami/haas-ja-coreml/resolve/$rev
          mkdir -p Vendor/HaasCore/Sources/HaasCore LifeLog/Haas
          for f in Audio Frontend HaasASR Tokenizer; do
            curl -fsSL "$base/swift/Sources/HaasCore/$f.swift" -o "Vendor/HaasCore/Sources/HaasCore/$f.swift"
          done
          curl -fsSL "$base/swift/Resources/frontend.bin" -o LifeLog/Haas/frontend.bin
          curl -fsSL "$base/swift/Resources/vocab.json" -o LifeLog/Haas/vocab.json
          cat > Vendor/HaasCore/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HaasCoreML",
              platforms: [.macOS(.v14), .iOS(.v17)],
              products: [.library(name: "HaasCore", targets: ["HaasCore"])],
              targets: [.target(name: "HaasCore", path: "Sources/HaasCore")]
          )
          SWIFT

      # 速11: 部品の作り置き（仮説: 2 回目の実行から効く）。SwiftPM の取ってきた部品と、Xcode のコンパイルの作り置き（中身は中間ファイルだけ。署名済みの成果物・鍵は入らない）
      - name: SwiftPM の部品の作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-screens-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-screens-${{ runner.os }}-
      - name: コンパイルの作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: cc-screens-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-screens-${{ runner.os }}-

      - name: テスト用のプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate --spec project-tests.yml

      - name: 全部の画面を開いて写真を撮る
        id: tour
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E "^[[:space:]]+iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "シミュレーター: $udid"
          set +e
          xcodebuild test             -project LifeLog.xcodeproj -scheme LifeLogUITests             -destination "id=$udid"             -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"             COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cc"             -skip-testing:LifeLogUITests/ScreenMatrix -resultBundlePath "$RUNNER_TEMP/screens.xcresult"             CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui.log" | grep -E "error:|Test Case|failed|落ちた|XCTAssert"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|落ちた|XCTAssert" "$RUNNER_TEMP/ui.log" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 写真を取り出して一覧の画像にする
        if: always()
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/screens"
          if [ -d "$RUNNER_TEMP/screens.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screens.xcresult" --output-path "$RUNNER_TEMP/raw"
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow || true
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/screens.py "$RUNNER_TEMP/raw" "$RUNNER_TEMP/screens"
          fi
          ls "$RUNNER_TEMP/screens" | head -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 画面の写真
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn

      - name: リリースに一覧の画像を付ける
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls "$RUNNER_TEMP"/screens/sheet-*.jpg >/dev/null 2>&1 || { echo "一覧の画像が無い"; exit 0; }
          # 同じコミットのリリースは「TestFlight」のワークフローが作る。できるまで最大40分待つ
          for i in $(seq 1 80); do
            tag=$(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq '.[] | select(.target_commitish=="${{ github.sha }}") | .tag_name' | head -1)
            if [ -n "$tag" ]; then
              gh release upload "$tag" "$RUNNER_TEMP"/screens/sheet-*.jpg --repo "${{ github.repository }}" --clobber
              echo "リリース $tag に付けた"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::同じコミットのリリースが見つからなかった"

      - name: 落ちた画面があれば失敗にする
        if: steps.tour.outputs.status != '0'
        run: exit 1


  # s22 見3・見4: 色の読みやすさと、画面の言葉の見回り。Python だけで数十秒。落とさず、数だけジョブの要約と成果物「色と言葉の報告」に出す。
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 色の読みやすさ（見3）と画面の言葉（見4）を数える
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          { python3 .github/scripts/contrast.py Shared/Design/LLTheme.swift "$RUNNER_TEMP/report" || echo "色の計算に失敗した（報告だけ・落とさない）"; } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/report/contrast.md"
          { python3 .github/scripts/words.py . "$RUNNER_TEMP/report" || echo "言葉の走査に失敗した（報告だけ・落とさない）"; } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/report/words.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 色と言葉の報告
          path: ${{ runner.temp }}/report
          if-no-files-found: warn

  # s22 見1・見2: 主な 20 画面を 明・暗・文字最大 で撮って 1 枚に並べる。文字最大ではみ出した所も数える（報告だけ）。
  # 必須の検査（build・test）や、ふだんの画面の見回り（screens）とは並べて動かす。ここが落ちても全体は赤にしない（continue-on-error）。
  screens-grid:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui != 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Haas-ja の Swift 部品を取ってくる
        run: |
          set -e
          rev=62f542657b454afa7873424e3dfb6d7a1d9c270d
          base=https://huggingface.co/Sanami/haas-ja-coreml/resolve/$rev
          mkdir -p Vendor/HaasCore/Sources/HaasCore LifeLog/Haas
          for f in Audio Frontend HaasASR Tokenizer; do
            curl -fsSL "$base/swift/Sources/HaasCore/$f.swift" -o "Vendor/HaasCore/Sources/HaasCore/$f.swift"
          done
          curl -fsSL "$base/swift/Resources/frontend.bin" -o LifeLog/Haas/frontend.bin
          curl -fsSL "$base/swift/Resources/vocab.json" -o LifeLog/Haas/vocab.json
          cat > Vendor/HaasCore/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HaasCoreML",
              platforms: [.macOS(.v14), .iOS(.v17)],
              products: [.library(name: "HaasCore", targets: ["HaasCore"])],
              targets: [.target(name: "HaasCore", path: "Sources/HaasCore")]
          )
          SWIFT

      - name: SwiftPM の部品の作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-grid-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-grid-${{ runner.os }}-
      - name: コンパイルの作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: cc-grid-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-grid-${{ runner.os }}-

      - name: テスト用のプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate --spec project-tests.yml

      - name: 20 画面を 3 通りで撮る
        id: tour
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E "^[[:space:]]+iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "シミュレーター: $udid"
          set +e
          xcodebuild test \
            -project LifeLog.xcodeproj -scheme LifeLogUITests \
            -destination "id=$udid" \
            -only-testing:LifeLogUITests/ScreenMatrix \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cc" \
            -resultBundlePath "$RUNNER_TEMP/grid.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/grid.log" | grep -E "error:|Test Case|failed|落ちた|XCTAssert"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|落ちた|XCTAssert" "$RUNNER_TEMP/grid.log" | sort -u | head -20 | while IFS= read -r line; do echo "::warning::${line}"; done
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 写真を 1 枚に並べて、はみ出しの報告を作る
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/grid"
          if [ -d "$RUNNER_TEMP/grid.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/grid.xcresult" --output-path "$RUNNER_TEMP/raw"
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow || true
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/grid.py "$RUNNER_TEMP/raw" "$RUNNER_TEMP/grid" || echo "並べる処理が失敗した"
            cat "$RUNNER_TEMP/grid/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "画面の一覧: 結果が無い（撮れなかった）" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -R "$RUNNER_TEMP/grid" | head -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 画面の一覧
          path: ${{ runner.temp }}/grid
          if-no-files-found: warn
