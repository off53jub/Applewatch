name: TestFlight

# 2026-11-27（s33 の 強7）から、main に入るたびではなく、毎晩 1 回（日本時間 23 時・仮）に「前の版から main が変わっていたら」だけ作る。
#   前の版 = 直前のアプリのリリース（タグが v で始まるもの。家の PC の pc-v… は見ない）の target_commitish。同じなら組み立てない（Mac を使わない）。
#   Actions 画面から手で動かす（workflow_dispatch）と、変わっていなくても作る。PR では今までどおり組み立てを確かめる。
#   前は main に push するたびに作っていて、1 日に 6 回ほど TestFlight に届いていた（446 → 462）。
# 毎回、署名なしの IPA を成果物（Artifacts）に残す。Windows の Sideloadly などで、無料の Apple ID で署名して入れられる。
# Apple Developer Program の Secrets が揃っているときだけ、TestFlight にも上げる。
on:
  schedule:
    # 毎晩 23:00（日本時間。UTC 14:00）。仮
    - cron: '0 14 * * *'
  pull_request:
  workflow_dispatch:

# 同じ PR に続けて push したら、古い実行は止める（main への push は止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更されたファイルを見て、関係ない変更（pc/・docs/・文書・ほかの workflow だけ）なら重い検査を飛ばす（速10）。
  # 飛ばしたジョブは Skipped になり、必須の検査としては通る。判定に失敗したときは、必ず動かす側に倒す。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      due: ${{ steps.due.outputs.due }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # s26 の C: IPA を作るのに使わない CI の手伝い（画面の写真・数え・夜の仕事・試し）だけの変更でも、Mac を使わない
          IGNORE='^(pc/|docs/|LifeLogUITests/)|\.md$|^\.github/workflows/(pc|tests|nightly|s26c-mac-night)\.yml$|^\.github/scripts/(screens|screens_diff|grid|contrast|words|notice_hints|s26c_[a-z_]+|test_[a-z0-9_]+)\.py$'
          files=""
          ok=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)') && ok=true
          elif [ "$EVENT" = "push" ] && [ "${BEFORE#0000000}" = "$BEFORE" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[] | .filename, (.previous_filename // empty)') && ok=true
            # compare は 300 ファイルまで。それ以上は全部動かす
            [ "$(echo "$files" | wc -l)" -ge 300 ] && ok=false
          fi
          [ -n "$files" ] || ok=false
          echo "変更したファイル:"; echo "$files" | head -50
          rest=$(echo "$files" | grep -Ev "$IGNORE" || true)
          if [ "$ok" = "true" ] && [ -z "$rest" ]; then app=false; else app=true; fi
          echo "判定 ok=$ok app=$app ui=${ui:-}"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      # s33 の 強7: 夜の 1 回は、前の版（直前のアプリのリリース）から main が変わっていたときだけ作る。
      # 調べられないときは作る側に倒す。手で動かしたとき・PR はいつも作る
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          due=true
          if [ "$EVENT" = "schedule" ]; then
            prev=$(gh api "repos/$REPO/releases?per_page=30" --jq '[.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith("v")))][0].target_commitish // empty' || true)
            echo "前の版のコミット: ${prev:-（見つからない）} / いまの main: $SHA"
            if [ -n "$prev" ] && [ "$prev" = "$SHA" ]; then
              due=false
              echo "::notice::TESTFLIGHT_RESULT: skipped reason=unchanged（前の版から main が変わっていないので、今夜は作りません）"
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.changes.outputs.due != 'false' }}
    runs-on: macos-26
    # Apple の受け付け結果を最大 35 分待つ分も含める
    timeout-minutes: 80
    # リリースに IPA を残すため（main に入ったときだけ使う）
    permissions:
      contents: write
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_REVERSED_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # 強化案 45: 組み立ての前に、文字列の中の生の改行と、見本の長いクロージャ（型推論の時間切れ）を数秒で見つける
      - name: Swift の組み立ての前の検査
        run: python3 .github/scripts/swift_precheck.py

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Google の ID が未設定（ログインできないビルドになる）
        if: env.HAS_GOOGLE != 'true'
        run: echo "::warning::GOOGLE_CLIENT_ID / GOOGLE_REVERSED_CLIENT_ID が Secrets にありません"

      # 日本語の音声認識 Haas-ja-v1.0 の Core ML 版（Apache-2.0、非公式の変換）。版を固定して取ってくる。
      # モデル本体（約620MB）はアプリが初回にダウンロードする。
      - name: Haas-ja の Swift 部品を取ってくる
        run: |
          set -e
          rev=62f542657b454afa7873424e3dfb6d7a1d9c270d
          base=https://huggingface.co/Sanami/haas-ja-coreml/resolve/$rev
          mkdir -p Vendor/HaasCore/Sources/HaasCore LifeLog/Haas
          for f in Audio Frontend HaasASR Tokenizer; do
            curl -fsSL "$base/swift/Sources/HaasCore/$f.swift" -o "Vendor/HaasCore/Sources/HaasCore/$f.swift"
          done
          curl -fsSL "$base/LICENSE" -o Vendor/HaasCore/LICENSE
          curl -fsSL "$base/NOTICE" -o Vendor/HaasCore/NOTICE
          curl -fsSL "$base/swift/Resources/frontend.bin" -o LifeLog/Haas/frontend.bin
          curl -fsSL "$base/swift/Resources/vocab.json" -o LifeLog/Haas/vocab.json
          # 確かめ用のコマンドラインツールは使わないので、ライブラリだけの Package.swift にする
          cat > Vendor/HaasCore/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HaasCoreML",
              platforms: [.macOS(.v14), .iOS(.v17)],
              products: [.library(name: "HaasCore", targets: ["HaasCore"])],
              targets: [.target(name: "HaasCore", path: "Sources/HaasCore")]
          )
          SWIFT

      # 速11: 部品の作り置き（仮説: 2 回目の実行から効く）。SwiftPM の取ってきた部品と、Xcode のコンパイルの作り置き（中身は中間ファイルだけ。署名済みの成果物・鍵は入らない）
      - name: SwiftPM の部品の作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-build-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-build-${{ runner.os }}-
      - name: コンパイルの作り置きを戻す
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: cc-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-build-${{ runner.os }}-

      - name: プロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect の API キーを置く
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # 貼り付けで改行が消えた・先頭と末尾の行が無い・空白が混じった、でも読めるように、鍵の形に整えて置く（2026-11-06）
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$body" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/asc/key.p8"
          # 中身は出さずに、鍵として読めるかだけ確かめる
          if openssl pkey -in "$RUNNER_TEMP/asc/key.p8" -noout 2>/dev/null; then
            echo "API キーは鍵として読めました（${#body} 文字）"
          else
            # 読めなければ TestFlight には送らず、今までどおり署名なしの IPA だけ作る（リリースは止めない）
            echo "::warning::ASC_KEY_P8 が鍵として読めません（${#body} 文字）。.p8 ファイルの中身を、BEGIN と END の行も含めてそのまま貼ってください。今回は TestFlight に送らず、署名なしの IPA だけ作ります"
            echo "ASC_UNUSABLE=true" >> "$GITHUB_ENV"
            echo "ASC_UNUSABLE_REASON=key-unreadable" >> "$GITHUB_ENV"
          fi

      # CI はビルドのたびに開発用の証明書を1枚作る。たまると上限（10枚）で署名できなくなる（2026-11-07 のビルド 154）。
      # API で作られた開発用のもののうち、2時間より前に作られたものを片づける（Sideloadly などほかの証明書には触らない）
      - name: 使い終わった開発用の証明書を片づける
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascpy"
          "$RUNNER_TEMP/ascpy/bin/pip" install --quiet pyjwt cryptography requests
          ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py cleanup-certs ||             echo "::warning::証明書を片づけられませんでした（署名に失敗するかもしれません）"

      - name: アーカイブ（署名は書き出し時にクラウドで行う）
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set +e
          archive() {
            rm -rf "$RUNNER_TEMP/LifeLog.xcarchive"
            xcodebuild archive \
              -project LifeLog.xcodeproj -scheme LifeLog \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/LifeLog.xcarchive" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
              COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cc" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
              "$@" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
            return ${PIPESTATUS[0]}
          }
          : > "$RUNNER_TEMP/build.log"
          # TestFlight に上げるときは、ヘルスケアの許可（entitlements）を入れるため、ビルドの段階から署名する
          if [ "$HAS_ASC" = "true" ] && [ "$ASC_UNUSABLE" != "true" ]; then
            sign=(-allowProvisioningUpdates
                  -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8"
                  -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
                  -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
                  CODE_SIGN_STYLE=Automatic)
            archive "${sign[@]}"
            status=$?
            # 署名のプロファイルを作った直後は、ビルドに間に合わないことがある（初回など）。1回だけやり直す。
            # （2026-11-23。s23 の 届1）前は大文字の "Provisioning Profiles" で探していたが、実際の文は小文字の "provisioning profiles"
            #  だったので、やり直しが動いていなかった。大文字小文字を区別せず、Apple との通信切れのときも 1 回やり直す
            if [ "$status" -ne 0 ] && grep -qiE "provisioning profiles|network connection was lost|connection (was )?lost|internet connection appears to be offline|timed out" "$RUNNER_TEMP/build.log"; then
              echo "::notice::署名のプロファイルが間に合わなかった・Apple との通信が切れたので、もう一度アーカイブします"
              archive "${sign[@]}"
              status=$?
            fi
            # それでも署名つきで作れなければ、TestFlight には送らず、今までどおり署名なしの IPA とリリースを作る
            if [ "$status" -ne 0 ]; then
              grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r line; do echo "::warning::${line}"; done
              echo "::warning::署名つきで作れなかったので、署名なしで作ります（今回は TestFlight に送りません）"
              echo "ASC_UNUSABLE=true" >> "$GITHUB_ENV"
              echo "ASC_UNUSABLE_REASON=signing-failed" >> "$GITHUB_ENV"
              : > "$RUNNER_TEMP/build.log"
              archive CODE_SIGNING_ALLOWED=NO
              status=$?
            fi
          else
            archive CODE_SIGNING_ALLOWED=NO
            status=$?
          fi
          # コンパイルのエラーは、ログを開かなくても見えるよう注記にも出す
          if [ "$status" -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status

      - name: 署名なしの IPA を作る
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/LifeLog.xcarchive/Products/Applications/LifeLog.app" "$RUNNER_TEMP/ipa/Payload/"
          for f in frontend.bin vocab.json; do
            if [ -f "$RUNNER_TEMP/ipa/Payload/LifeLog.app/$f" ]; then echo "::notice::Haas-ja の部品 $f がアプリに入っています"
            else echo "::error::Haas-ja の部品 $f がアプリに入っていません"; exit 1; fi
          done
          # ロック画面・時計の文字盤のボタン（拡張機能）が入っているか
          find "$RUNNER_TEMP/ipa/Payload" -name "*.appex" -type d | while IFS= read -r ext; do echo "::notice::拡張機能 ${ext#$RUNNER_TEMP/ipa/Payload/}"; done
          (cd "$RUNNER_TEMP/ipa" && zip -qry LifeLog-unsigned.ipa Payload)
          # 拡張機能を抜いた版も作る（Sideloadly が拡張機能を署名できなかったときの予備）
          mkdir -p "$RUNNER_TEMP/ipa-lite"
          cp -R "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/ipa-lite/"
          rm -rf "$RUNNER_TEMP/ipa-lite/Payload/LifeLog.app/PlugIns" "$RUNNER_TEMP/ipa-lite/Payload/LifeLog.app/Watch/LifeLogWatch.app/PlugIns"
          (cd "$RUNNER_TEMP/ipa-lite" && zip -qry "$RUNNER_TEMP/ipa/LifeLog-unsigned-no-widgets.ipa" Payload)

      # 2026-11-16: 落ち・書き込み過多の記録（MetricKit）はアプリの中を番地でしか持たないので、番地を関数名に直すための dSYM を残す
      #   （中身は関数の名前と行の位置だけ。会話・鍵は入っていない）。前は残しておらず、組み立て直して調べた
      - name: dSYM を残す
        id: dsym
        run: |
          if [ -d "$RUNNER_TEMP/LifeLog.xcarchive/dSYMs" ]; then
            (cd "$RUNNER_TEMP/LifeLog.xcarchive" && zip -qry "$RUNNER_TEMP/LifeLog-dSYMs-${{ github.run_number }}.zip" dSYMs)
            for f in "$RUNNER_TEMP/LifeLog.xcarchive/dSYMs"/*.dSYM; do dwarfdump --uuid "$f" | sed 's/^/::notice::/'; done
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::dSYM がアーカイブにありません"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.dsym.outputs.ok == 'true'
        with:
          name: LifeLog-dSYMs-${{ github.run_number }}
          path: ${{ runner.temp }}/LifeLog-dSYMs-${{ github.run_number }}.zip
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: LifeLog-unsigned-ipa
          path: |
            ${{ runner.temp }}/ipa/LifeLog-unsigned.ipa
            ${{ runner.temp }}/ipa/LifeLog-unsigned-no-widgets.ipa
          retention-days: 30

      # main の版を作るたびに（2026-11-27 から夜の 1 回と手で動かしたとき）、版の名前（v日付-ビルド番号）を付けて GitHub の「リリース」に IPA を残す。
      # 成果物は30日で消えるが、リリースは残るので、新しい版で困ったら前の版を入れ直せる（2026-11-06）。夜の 1 回の「前の版」もこのリリースで見る
      - name: リリースに残す
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(TZ=Asia/Tokyo date +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/ipa/LifeLog-unsigned.ipa" "$RUNNER_TEMP/ipa/LifeLog-unsigned-no-widgets.ipa"             --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$tag" --generate-notes
          echo "::notice::リリース $tag に IPA を残しました"

      - name: Watch アプリの場所を調べる
        id: watch
        run: |
          app="$RUNNER_TEMP/ipa/Payload/LifeLog.app"
          if [ -d "$app/Watch/LifeLogWatch.app" ]; then echo "in_ipa=true" >> "$GITHUB_OUTPUT"; else echo "in_ipa=false" >> "$GITHUB_OUTPUT"; fi
          if find "$RUNNER_TEMP/LifeLog.xcarchive" -name LifeLogWatch.app -type d | grep -q .; then echo "in_archive=true" >> "$GITHUB_OUTPUT"; else echo "in_archive=false" >> "$GITHUB_OUTPUT"; fi
          find "$RUNNER_TEMP/LifeLog.xcarchive" -name "*.app" -type d
          companion=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$app/Watch/LifeLogWatch.app/Info.plist" 2>/dev/null || true)
          if [ "$companion" = "com.off53jub.lifelog" ]; then echo "companion_ok=true" >> "$GITHUB_OUTPUT"; else echo "companion_ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Watch アプリは IPA に入っている
        if: steps.watch.outputs.in_ipa == 'true'
        run: echo ok

      - name: Watch アプリの相棒 ID は com.off53jub.lifelog
        if: steps.watch.outputs.companion_ok == 'true'
        run: echo ok

      - name: Watch アプリは archive にはあるが IPA に入っていない
        if: steps.watch.outputs.in_ipa != 'true' && steps.watch.outputs.in_archive == 'true'
        run: exit 1

      - name: Watch アプリがどこにも無い
        if: steps.watch.outputs.in_ipa != 'true' && steps.watch.outputs.in_archive != 'true'
        run: exit 1

      - name: 署名して TestFlight にアップロード
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LifeLog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # 送れても、Apple の受け付けの検査で弾かれることがある（2026-11-06 は ITMS-90626 で3回とも弾かれていた）。
      # 結果が出るまで待ち、弾かれたら理由を出してこのジョブを失敗にする。
      # main のときだけ、内部テストのグループにビルドを渡す（PR のビルドは本人に届かない。2026-11-07）
      # （2026-11-23。s23 の 届6）TestFlight の「テストする内容」に入れる文を作る: 前の版（直前の GitHub のリリース）からのコミットの題の一覧。
      #  作れなくても配達は止めない（continue-on-error）。前のリリースが見つからないときは、直近 10 コミット
      # （2026-11-27。s33 の 強7）頭に「この版で見る 3 つ」: 前の版のあと（無ければこの 24 時間）に main に入った PR の題から 3 つまで。
      #  前の版はアプリのリリース（タグが v で始まるもの）だけで探す（家の PC の pc-v… を前の版と取り違えない）
      - name: この版で変わったことの文を作る
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          rel=$(gh api "repos/$REPO/releases?per_page=30" --jq "[.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith(\"v\")) and .target_commitish != \"$SHA\")][0] | [.target_commitish, .created_at] | @tsv" || true)
          prev=$(printf '%s' "$rel" | cut -f1)
          since=$(printf '%s' "$rel" | cut -f2)
          [ -n "$since" ] || since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          mode=recent
          : > "$RUNNER_TEMP/commits.json"
          if [ -n "$prev" ] && gh api "repos/$REPO/compare/$prev...$SHA" > "$RUNNER_TEMP/commits.json"; then
            mode=compare
            echo "前の版のコミット: ${prev:0:7}"
          else
            gh api "repos/$REPO/commits?sha=$SHA&per_page=10" > "$RUNNER_TEMP/commits.json" || true
          fi
          # 前の版のあとに main に入った PR（題だけ。読めなければ空で、「この版で見る 3 つ」は付けない）
          gh pr list --repo "$REPO" --base main --state merged --search "merged:>=$since" --limit 50             --json number,title,mergedAt > "$RUNNER_TEMP/prs.json" || echo "[]" > "$RUNNER_TEMP/prs.json"
          python3 .github/scripts/whatsnew.py "$RUNNER_TEMP/commits.json" "$RUNNER_TEMP/whatsnew.txt" "$mode" "$RUNNER_TEMP/prs.json"
          echo "ASC_WHATS_NEW_FILE=$RUNNER_TEMP/whatsnew.txt" >> "$GITHUB_ENV"

      - name: Apple の受け付け結果を待つ
        id: wait
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        timeout-minutes: 40
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_RESULT_FILE: ${{ runner.temp }}/asc-result.txt
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py wait-upload "${{ github.run_number }}"

      # この CI で作った開発用の証明書を片づける（失敗しても、ほかの手順の結果は変えない）
      - name: この CI で作った証明書を片づける
        if: always() && env.HAS_ASC == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -x "$RUNNER_TEMP/ascpy/bin/python" ] || exit 0
          [ -f "$RUNNER_TEMP/asc/key.p8" ] || exit 0
          ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py revoke-own-cert

      # （2026-11-23。s23 の 届2・届3）TestFlight に届いたか・届いていないかを、実行の「成功」の陰に隠さず、必ず 1 行で出す。
      #  同じ形の 1 行を、ログ・注記（annotations）・実行のまとめ（$GITHUB_STEP_SUMMARY）に出す。母艦は `gh run view <id> --log` か
      #  `gh api repos/R/check-runs/<job id>/annotations` から「TESTFLIGHT_RESULT:」で探せる:
      #    TESTFLIGHT_RESULT: delivered build=N group=yes|no|failed   … Apple が受け付けた（group=yes は内部テストのグループにも渡した。main のときだけ）
      #    TESTFLIGHT_RESULT: not-delivered build=N reason=...         … reason は no-secrets・key-unreadable・signing-failed・rejected・unconfirmed・build-failed
      #  main の夜の 1 回・main への push（と main の手動実行）で、Secrets があるのに届かなかったときは、この手順で失敗にする（PR・Secrets の無いフォークでは失敗にしない）
      - name: TestFlight に届いたかをまとめる
        if: always() && !cancelled()
        env:
          BUILD: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          res=$(cat "$RUNNER_TEMP/asc-result.txt" 2>/dev/null || true)
          reason=""
          if [ "$HAS_ASC" != "true" ]; then reason="no-secrets"
          elif [ "$ASC_UNUSABLE" = "true" ]; then reason="${ASC_UNUSABLE_REASON:-signing-failed}"
          elif [ "$WAIT_OUTCOME" = "failure" ] || [ "$res" = "rejected" ]; then reason="rejected"
          elif [ "${res%% *}" = "delivered" ]; then reason=""
          elif [ "$JOB_STATUS" = "failure" ]; then reason="build-failed"
          else reason="unconfirmed"; fi
          if [ -z "$reason" ]; then
            line="TESTFLIGHT_RESULT: delivered build=$BUILD ${res#delivered }"
            echo "::notice::$line"
            msg="TestFlight に届きました。ビルド $BUILD を渡しました"
            case "$res" in
              *group=yes*) msg="$msg（内部テストのグループにも渡しました）";;
              *group=no*) msg="$msg（main ではないので、テスターには渡していません）";;
              *group=failed*) msg="$msg（グループに渡せませんでした。TestFlight で手で渡してください）";;
            esac
          else
            line="TESTFLIGHT_RESULT: not-delivered build=$BUILD reason=$reason"
            echo "::warning::$line（TestFlight には届いていません）"
            msg="TestFlight に届いていません（理由: $reason）"
          fi
          echo "$line"
          { echo "### TestFlight"; echo; echo "$msg"; echo; echo "\`$line\`"; } >> "$GITHUB_STEP_SUMMARY"
          # 届かなかったのに実行が「成功」で終わるのを防ぐ（2026-11-23。版 382 で起きた）。ビルドそのものの失敗は前の手順がもう赤にしている。unconfirmed（35 分待っても結果が出ない。届いているかもしれない）は警告だけ
          on_main=false
          if [ "$REF" = "refs/heads/main" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; }; then on_main=true; fi
          if [ -n "$reason" ] && [ "$on_main" = "true" ] && [ "$HAS_ASC" = "true" ] && [ "$reason" != "build-failed" ] && [ "$reason" != "unconfirmed" ]; then
            echo "::error::main への実行なのに、TestFlight に届きませんでした（理由: $reason）"
            exit 1
          fi
