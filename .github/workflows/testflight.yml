name: TestFlight

# main に push するか、Actions 画面から手動で実行するとビルドする。
# 毎回、署名なしの IPA を成果物（Artifacts）に残す。Windows の Sideloadly などで、無料の Apple ID で署名して入れられる。
# Apple Developer Program の Secrets が揃っているときだけ、TestFlight にも上げる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    # Apple の受け付け結果を最大 35 分待つ分も含める
    timeout-minutes: 80
    # リリースに IPA を残すため（main に入ったときだけ使う）
    permissions:
      contents: write
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_REVERSED_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Google の ID が未設定（ログインできないビルドになる）
        if: env.HAS_GOOGLE != 'true'
        run: echo "::warning::GOOGLE_CLIENT_ID / GOOGLE_REVERSED_CLIENT_ID が Secrets にありません"

      # 日本語の音声認識 Haas-ja-v1.0 の Core ML 版（Apache-2.0、非公式の変換）。版を固定して取ってくる。
      # モデル本体（約620MB）はアプリが初回にダウンロードする。
      - name: Haas-ja の Swift 部品を取ってくる
        run: |
          set -e
          rev=62f542657b454afa7873424e3dfb6d7a1d9c270d
          base=https://huggingface.co/Sanami/haas-ja-coreml/resolve/$rev
          mkdir -p Vendor/HaasCore/Sources/HaasCore LifeLog/Haas
          for f in Audio Frontend HaasASR Tokenizer; do
            curl -fsSL "$base/swift/Sources/HaasCore/$f.swift" -o "Vendor/HaasCore/Sources/HaasCore/$f.swift"
          done
          curl -fsSL "$base/LICENSE" -o Vendor/HaasCore/LICENSE
          curl -fsSL "$base/NOTICE" -o Vendor/HaasCore/NOTICE
          curl -fsSL "$base/swift/Resources/frontend.bin" -o LifeLog/Haas/frontend.bin
          curl -fsSL "$base/swift/Resources/vocab.json" -o LifeLog/Haas/vocab.json
          # 確かめ用のコマンドラインツールは使わないので、ライブラリだけの Package.swift にする
          cat > Vendor/HaasCore/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "HaasCoreML",
              platforms: [.macOS(.v14), .iOS(.v17)],
              products: [.library(name: "HaasCore", targets: ["HaasCore"])],
              targets: [.target(name: "HaasCore", path: "Sources/HaasCore")]
          )
          SWIFT

      - name: プロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect の API キーを置く
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # 貼り付けで改行が消えた・先頭と末尾の行が無い・空白が混じった、でも読めるように、鍵の形に整えて置く（2026-11-06）
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$body" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/asc/key.p8"
          # 中身は出さずに、鍵として読めるかだけ確かめる
          if openssl pkey -in "$RUNNER_TEMP/asc/key.p8" -noout 2>/dev/null; then
            echo "API キーは鍵として読めました（${#body} 文字）"
          else
            # 読めなければ TestFlight には送らず、今までどおり署名なしの IPA だけ作る（リリースは止めない）
            echo "::warning::ASC_KEY_P8 が鍵として読めません（${#body} 文字）。.p8 ファイルの中身を、BEGIN と END の行も含めてそのまま貼ってください。今回は TestFlight に送らず、署名なしの IPA だけ作ります"
            echo "ASC_UNUSABLE=true" >> "$GITHUB_ENV"
          fi

      # CI はビルドのたびに開発用の証明書を1枚作る。たまると上限（10枚）で署名できなくなる（2026-11-07 のビルド 154）。
      # API で作られた開発用のもののうち、2時間より前に作られたものを片づける（Sideloadly などほかの証明書には触らない）
      - name: 使い終わった開発用の証明書を片づける
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascpy"
          "$RUNNER_TEMP/ascpy/bin/pip" install --quiet pyjwt cryptography requests
          ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py cleanup-certs ||             echo "::warning::証明書を片づけられませんでした（署名に失敗するかもしれません）"

      - name: アーカイブ（署名は書き出し時にクラウドで行う）
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set +e
          archive() {
            rm -rf "$RUNNER_TEMP/LifeLog.xcarchive"
            xcodebuild archive \
              -project LifeLog.xcodeproj -scheme LifeLog \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/LifeLog.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
              "$@" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
            return ${PIPESTATUS[0]}
          }
          : > "$RUNNER_TEMP/build.log"
          # TestFlight に上げるときは、ヘルスケアの許可（entitlements）を入れるため、ビルドの段階から署名する
          if [ "$HAS_ASC" = "true" ] && [ "$ASC_UNUSABLE" != "true" ]; then
            sign=(-allowProvisioningUpdates
                  -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8"
                  -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
                  -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
                  CODE_SIGN_STYLE=Automatic)
            archive "${sign[@]}"
            status=$?
            # 署名のプロファイルを作った直後は、ビルドに間に合わないことがある（初回など）。1回だけやり直す
            if [ "$status" -ne 0 ] && grep -q "Provisioning Profiles" "$RUNNER_TEMP/build.log"; then
              echo "::notice::署名のプロファイルが間に合わなかったので、もう一度アーカイブします"
              archive "${sign[@]}"
              status=$?
            fi
            # それでも署名つきで作れなければ、TestFlight には送らず、今までどおり署名なしの IPA とリリースを作る
            if [ "$status" -ne 0 ]; then
              grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r line; do echo "::warning::${line}"; done
              echo "::warning::署名つきで作れなかったので、署名なしで作ります（今回は TestFlight に送りません）"
              echo "ASC_UNUSABLE=true" >> "$GITHUB_ENV"
              : > "$RUNNER_TEMP/build.log"
              archive CODE_SIGNING_ALLOWED=NO
              status=$?
            fi
          else
            archive CODE_SIGNING_ALLOWED=NO
            status=$?
          fi
          # コンパイルのエラーは、ログを開かなくても見えるよう注記にも出す
          if [ "$status" -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status

      - name: 署名なしの IPA を作る
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/LifeLog.xcarchive/Products/Applications/LifeLog.app" "$RUNNER_TEMP/ipa/Payload/"
          for f in frontend.bin vocab.json; do
            if [ -f "$RUNNER_TEMP/ipa/Payload/LifeLog.app/$f" ]; then echo "::notice::Haas-ja の部品 $f がアプリに入っています"
            else echo "::error::Haas-ja の部品 $f がアプリに入っていません"; exit 1; fi
          done
          # ロック画面・時計の文字盤のボタン（拡張機能）が入っているか
          find "$RUNNER_TEMP/ipa/Payload" -name "*.appex" -type d | while IFS= read -r ext; do echo "::notice::拡張機能 ${ext#$RUNNER_TEMP/ipa/Payload/}"; done
          (cd "$RUNNER_TEMP/ipa" && zip -qry LifeLog-unsigned.ipa Payload)
          # 拡張機能を抜いた版も作る（Sideloadly が拡張機能を署名できなかったときの予備）
          mkdir -p "$RUNNER_TEMP/ipa-lite"
          cp -R "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/ipa-lite/"
          rm -rf "$RUNNER_TEMP/ipa-lite/Payload/LifeLog.app/PlugIns" "$RUNNER_TEMP/ipa-lite/Payload/LifeLog.app/Watch/LifeLogWatch.app/PlugIns"
          (cd "$RUNNER_TEMP/ipa-lite" && zip -qry "$RUNNER_TEMP/ipa/LifeLog-unsigned-no-widgets.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: LifeLog-unsigned-ipa
          path: |
            ${{ runner.temp }}/ipa/LifeLog-unsigned.ipa
            ${{ runner.temp }}/ipa/LifeLog-unsigned-no-widgets.ipa
          retention-days: 30

      # main に入るたびに、版の名前（v日付-ビルド番号）を付けて GitHub の「リリース」に IPA を残す。
      # 成果物は30日で消えるが、リリースは残るので、新しい版で困ったら前の版を入れ直せる（2026-11-06）
      - name: リリースに残す
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(TZ=Asia/Tokyo date +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/ipa/LifeLog-unsigned.ipa" "$RUNNER_TEMP/ipa/LifeLog-unsigned-no-widgets.ipa"             --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$tag" --generate-notes
          echo "::notice::リリース $tag に IPA を残しました"

      - name: Watch アプリの場所を調べる
        id: watch
        run: |
          app="$RUNNER_TEMP/ipa/Payload/LifeLog.app"
          if [ -d "$app/Watch/LifeLogWatch.app" ]; then echo "in_ipa=true" >> "$GITHUB_OUTPUT"; else echo "in_ipa=false" >> "$GITHUB_OUTPUT"; fi
          if find "$RUNNER_TEMP/LifeLog.xcarchive" -name LifeLogWatch.app -type d | grep -q .; then echo "in_archive=true" >> "$GITHUB_OUTPUT"; else echo "in_archive=false" >> "$GITHUB_OUTPUT"; fi
          find "$RUNNER_TEMP/LifeLog.xcarchive" -name "*.app" -type d
          companion=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$app/Watch/LifeLogWatch.app/Info.plist" 2>/dev/null || true)
          if [ "$companion" = "com.off53jub.lifelog" ]; then echo "companion_ok=true" >> "$GITHUB_OUTPUT"; else echo "companion_ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Watch アプリは IPA に入っている
        if: steps.watch.outputs.in_ipa == 'true'
        run: echo ok

      - name: Watch アプリの相棒 ID は com.off53jub.lifelog
        if: steps.watch.outputs.companion_ok == 'true'
        run: echo ok

      - name: Watch アプリは archive にはあるが IPA に入っていない
        if: steps.watch.outputs.in_ipa != 'true' && steps.watch.outputs.in_archive == 'true'
        run: exit 1

      - name: Watch アプリがどこにも無い
        if: steps.watch.outputs.in_ipa != 'true' && steps.watch.outputs.in_archive != 'true'
        run: exit 1

      - name: 署名して TestFlight にアップロード
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LifeLog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # 送れても、Apple の受け付けの検査で弾かれることがある（2026-11-06 は ITMS-90626 で3回とも弾かれていた）。
      # 結果が出るまで待ち、弾かれたら理由を出してこのジョブを失敗にする。
      # main のときだけ、内部テストのグループにビルドを渡す（PR のビルドは本人に届かない。2026-11-07）
      - name: Apple の受け付け結果を待つ
        if: env.HAS_ASC == 'true' && env.ASC_UNUSABLE != 'true'
        timeout-minutes: 40
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py wait-upload "${{ github.run_number }}"

      # この CI で作った開発用の証明書を片づける（失敗しても、ほかの手順の結果は変えない）
      - name: この CI で作った証明書を片づける
        if: always() && env.HAS_ASC == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -x "$RUNNER_TEMP/ascpy/bin/python" ] || exit 0
          [ -f "$RUNNER_TEMP/asc/key.p8" ] || exit 0
          ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8" "$RUNNER_TEMP/ascpy/bin/python" .github/scripts/asc.py revoke-own-cert
